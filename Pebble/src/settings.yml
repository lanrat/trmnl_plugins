---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: node
polling_url: "https://appstore-api.repebble.com/api/v1/apps/collection/{{feed}}/watchfaces?limit=40\r\nhttps://appstore-api.repebble.com/api/v1/apps/collection/{{feed}}/watchapps-and-companions?limit=40"
polling_headers: ''
polling_body: ''
id: 281436
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: doesnt_matter
  field_type: author_bio
  name: Pebble Appstore
  description: Browse watchfaces and apps from the <a href="https://apps.repebble.com/">repebble appstore</a> on your TRMNL device.
  category: discovery
  github_url: https://github.com/lanrat/trmnl_plugins
- keyname: feed
  field_type: select
  name: Feed
  description: Which collection to browse
  help_text: most-loved = top picks by hearts; all = every app (use Sort below to choose update vs release order)
  default: most-loved
  options:
  - most-loved
  - all
  conditional_validation:
  - when: most-loved
    hidden:
    - sort_mode
- keyname: sort_mode
  field_type: select
  name: Sort
  description: Sort order when browsing the 'all' feed
  help_text: updated = recently updated (default); released = recently released (sorts by latest release date)
  default: updated
  options:
  - updated
  - released
- keyname: content_type
  field_type: select
  name: Content Type
  description: Show watchfaces, apps, or both
  help_text: both = mixed faces and apps; watchfaces = faces only; apps = apps only
  default: both
  options:
  - both
  - watchfaces
  - apps
name: Pebble Appstore
description:
refresh_interval: 720
